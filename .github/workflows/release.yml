name: Release

on:
  push:
    branches: [main, master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up JDK 25
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build NoiseTool
        uses: burrunan/gradle-cache-action@v3.0.1
        with:
          arguments: build -x test
          gradle-version: wrapper
          properties: |
            kotlin.parallel.tasks.in.project=true

      - name: Get version
        id: version
        run: echo "VERSION=$(grep '^version' build.gradle.kts | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      - name: Stage and zip distribution
        run: |
          mkdir -p dist/addons
          cp build/libs/NoiseTool-*-all.jar dist/
          cp -r build/libs/addons/. dist/addons/
          cp StartNoiseTool.bat dist/
          cd dist && zip -r ../NoiseTool-${{ steps.version.outputs.VERSION }}.zip .

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists — uploading asset"
            gh release upload "v${VERSION}" "NoiseTool-${VERSION}.zip" --clobber
          else
            gh release create "v${VERSION}" \
              --title "NoiseTool v${VERSION}" \
              --generate-notes \
              "NoiseTool-${VERSION}.zip"
          fi
