name: Java CI

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up JDK 25
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build NoiseTool
        uses: burrunan/gradle-cache-action@v3.0.1
        with:
          arguments: build -x test
          gradle-version: wrapper
          properties: |
            kotlin.parallel.tasks.in.project=true

      - name: Stage distribution
        run: |
          mkdir -p dist/addons/bootstrap
          cp build/libs/NoiseTool-*-all.jar dist/
          cp -r build/libs/addons/. dist/addons/
          cp StartNoiseTool.bat dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoiseTool-${{ github.sha }}
          path: dist/
